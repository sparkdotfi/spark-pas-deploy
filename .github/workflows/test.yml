name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

env:
  FOUNDRY_PROFILE: ci

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Build contracts
        run: |
          forge --version
          forge build --sizes
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Run tests
        env:
          ALCHEMY_APIKEY: ${{secrets.ALCHEMY_APIKEY}}
          MAINNET_RPC_URL: ${{secrets.MAINNET_RPC_URL}}
          OPTIMISM_RPC_URL: ${{secrets.OPTIMISM_RPC_URL}}
          ARBITRUM_ONE_RPC_URL: ${{secrets.ARBITRUM_ONE_RPC_URL}}
          ARBITRUM_NOVA_RPC_URL: ${{secrets.ARBITRUM_NOVA_RPC_URL}}
          GNOSIS_CHAIN_RPC_URL: ${{secrets.GNOSIS_CHAIN_RPC_URL}}
          BASE_RPC_URL: ${{secrets.BASE_RPC_URL}}
          GOERLI_RPC_URL: ${{secrets.GOERLI_RPC_URL}}
          UNICHAIN_RPC_URL: ${{secrets.UNICHAIN_RPC_URL}}
          RH_RPC_URL: ${{secrets.RH_RPC_URL}}
          XLAYER_RPC_URL: ${{secrets.XLAYER_RPC_URL}}
          ETHERSCAN_API_KEY: ${{secrets.ETHERSCAN_API_KEY}}
        run: FOUNDRY_PROFILE=ci forge test
